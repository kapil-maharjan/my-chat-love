<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basics</title>
</head>
<body>
     <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
  const container = document.querySelector('.js-container');
  const root = ReactDOM.createRoot(container);
            // 1. Move the layout logic into a function or a component
function updateUI() {
    const productCost = 10 + 8 * 2;
    const shippingCost = 5;
    const todayDate = dayjs().format('MMMM D');
    const currentTime = dayjs().format('HH:mm:ss');

    const layout = (
        <div>
            <p>Today's date is {todayDate}</p>
            <p>Current Time: {currentTime}</p>
            <p>Product cost: ${productCost}</p>
            <p>Shipping cost: ${shippingCost}</p>
            <p>Total cost: ${productCost + shippingCost}</p>
            <button>Place your order</button>
        </div>
    );

    // 2. Render the whole layout again
    root.render(layout);
}

// 3. Run the function immediately and then every second
updateUI();
setInterval(updateUI, 1000);

      
    </script>
</body>
</html>

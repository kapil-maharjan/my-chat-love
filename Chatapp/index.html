<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Real-Time Chat</title>
</head>
<body>
    <h2>ห้องแชทสุดล้ำ 🚀</h2>
    <div id="chat-window">
        <ul id="messages"></ul>
    </div>

    <form id="form">
        <input id="user" placeholder="ชื่อของคุณ..." required style="flex: 0.3;">
        <input id="input" placeholder="พิมพ์ข้อความ..." autocomplete="off" required>
        <button>ส่ง</button>
    </form>
    
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const user = document.getElementById('user');
    const messages = document.getElementById('messages');
    const chatWindow = document.getElementById('chat-window');

    // --- ส่วนที่เพิ่ม: โหลดข้อความเก่าจากเครื่องมาแสดงทันทีที่เปิดแอป ---
    const savedMessages = JSON.parse(localStorage.getItem('my_chat_history')) || [];
    savedMessages.forEach(data => {
        addMessageToUI(data);
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value && user.value) {
            socket.emit('chat message', {
                user: user.value,
                msg: input.value
            });
            input.value = '';
        }
    });

    socket.on('chat message', (data) => {
        addMessageToUI(data);

        // --- ส่วนที่เพิ่ม: เซฟข้อความใหม่ลงเครื่อง ---
        savedMessages.push(data);
        if (savedMessages.length > 100) savedMessages.shift(); // เก็บไว้แค่ 100 ข้อความล่าสุด
        localStorage.setItem('my_chat_history', JSON.stringify(savedMessages));
    });

    // ฟังก์ชันช่วยแสดงผลข้อความ
    function addMessageToUI(data) {
        const item = document.createElement('li');
        item.innerHTML = `<span class="username">${data.user}</span> ${data.msg}`;
        messages.appendChild(item);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
</script>


</body>
</html>

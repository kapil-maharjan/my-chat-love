<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Real-Time Chat</title>
</head>
<body>
    <h2>ห้องแชทสุดล้ำ 🚀</h2>
    <div id="chat-window">
        <ul id="messages"></ul>
    </div>

    <form id="form">
        <input id="user" placeholder="ชื่อของคุณ..." required style="flex: 0.3;">
        <input id="input" placeholder="พิมพ์ข้อความ..." autocomplete="off" required>
        <button>ส่ง</button>
    </form>
    
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const user = document.getElementById('user');
    const messages = document.getElementById('messages');
    const chatWindow = document.getElementById('chat-window');

    // 1. โหลดข้อความเก่าจาก LocalStorage มาแสดงทันทีที่เปิดแอป
    const savedMessages = JSON.parse(localStorage.getItem('my_chat_history')) || [];
    savedMessages.forEach(data => {
        addMessageToUI(data);
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value && user.value) {
            // สร้างข้อมูลเวลาปัจจุบัน
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ":" + 
                               now.getMinutes().toString().padStart(2, '0');
            const dateString = now.toLocaleDateString('th-TH', { day:'numeric', month:'short' });

            socket.emit('chat message', {
                user: user.value,
                msg: input.value,
                time: timeString,
                date: dateString
            });
            input.value = '';
        }
    });

    socket.on('chat message', (data) => {
        addMessageToUI(data);

        // 2. เซฟข้อความใหม่ลงเครื่อง (LocalStorage)
        savedMessages.push(data);
        if (savedMessages.length > 100) savedMessages.shift(); 
        localStorage.setItem('my_chat_history', JSON.stringify(savedMessages));
    });

    // 3. ฟังก์ชันแสดงผลข้อความ (พร้อมชื่อ, ข้อความ, และเวลา)
    function addMessageToUI(data) {
        const item = document.createElement('li');
        // ตรวจสอบว่ามีข้อมูลเวลาไหม (เผื่อข้อความเก่าที่ยังไม่มีเวลา)
        const displayTime = data.time ? `${data.date} | ${data.time}` : "";
        
        item.innerHTML = `
            <span class="username" style="display: block; font-weight: bold; color: #007bff; font-size: 0.8em;">${data.user}</span> 
            <span class="text">${data.msg}</span>
            <small style="display: block; font-size: 0.7em; color: #999; margin-top: 4px;">${displayTime}</small>
        `;
        messages.appendChild(item);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
</script>


</body>
</html>
